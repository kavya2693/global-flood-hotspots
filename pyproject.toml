[project]
name = "floodhotspots"
version = "0.1.0"
description = "Does rainfall depth predict flood extent across twelve global flood regions"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
